<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikMedia Downloader | Release Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        
        /* Markdown Styling - Menyesuaikan dengan gambar Changelog kamu */
        .markdown-content h1, .markdown-content h2 { 
            font-weight: 800; 
            margin-top: 2rem; 
            margin-bottom: 1rem; 
            color: #0f172a;
            letter-spacing: -0.025em;
        }
        .markdown-content h1 { font-size: 1.875rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; }
        .markdown-content h2 { font-size: 1.5rem; color: #1e293b; }
        .markdown-content h3 { 
            font-weight: 700; 
            font-size: 1.1rem; 
            margin-top: 1.5rem; 
            margin-bottom: 0.75rem; 
            color: #334155;
            display: flex;
            align-items: center;
        }
        .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-content ul { margin-bottom: 1.25rem; }
        .markdown-content li { 
            margin-bottom: 0.4rem; 
            padding-left: 1.5rem; 
            position: relative; 
            list-style: none;
        }
        .markdown-content li::before { 
            content: "•"; 
            position: absolute; 
            left: 0.5rem; 
            color: #94a3b8; 
            font-weight: bold; 
        }
        .markdown-content strong { color: #0f172a; font-weight: 700; }
        .markdown-content code { 
            background: #f1f5f9; 
            padding: 0.2rem 0.4rem; 
            border-radius: 6px; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875em;
            color: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <nav class="sticky top-0 z-50 glass border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i data-lucide="download-cloud" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">TikMedia</span>
            </div>
            <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                <a href="#" class="hover:text-blue-600 transition-colors">Beranda</a>
                <a href="#releases" class="hover:text-blue-600 transition-colors">Releases</a>
            </div>
            <a href="https://github.com/anggialansori404/TikMedia-Downloader-Release" target="_blank" 
               class="bg-slate-900 text-white px-5 py-2 rounded-full text-xs font-bold hover:bg-slate-800 transition-all flex items-center gap-2">
                <i data-lucide="github" class="w-4 h-4"></i> GITHUB
            </a>
        </div>
    </nav>

    <main id="releases" class="max-w-4xl mx-auto px-4 py-16">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-4">
            <div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3">
                    <i data-lucide="scroll-text" class="text-blue-600 w-8 h-8"></i> Catatan Perubahan
                </h2>
                <p class="text-slate-500 text-sm mt-1">Pantau pembaruan fitur dan perbaikan bug terbaru.</p>
            </div>
            <div class="relative w-full md:w-72">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="versionSearch" placeholder="Cari versi spesifik..." 
                       class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-50 focus:border-blue-500 outline-none text-sm transition-all shadow-sm">
            </div>
        </div>

        <div id="release-container" class="space-y-10 relative">
            <div class="animate-pulse bg-white p-10 rounded-[2.5rem] border border-slate-200 h-80 shadow-sm"></div>
        </div>
    </main>

    <script>
        const repo = "anggialansori404/TikMedia-Downloader-Release";
        const container = document.getElementById('release-container');
        const searchInput = document.getElementById('versionSearch');
        let allData = [];

        // Konfigurasi Marked.js untuk keamanan dan line breaks
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        async function fetchReleases() {
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
                allData = await res.json();
                render(allData);
            } catch (e) { 
                container.innerHTML = `<div class="p-8 text-center bg-red-50 text-red-600 rounded-3xl border border-red-100">Gagal memuat data dari GitHub. Silakan refresh halaman.</div>`; 
            }
        }

        function render(data) {
            container.innerHTML = '';
            if (data.length === 0) {
                container.innerHTML = `<div class="p-20 text-center text-slate-400 italic font-medium">Versi tidak ditemukan...</div>`;
                return;
            }

            data.forEach((rel, idx) => {
                const isLatest = idx === 0;
                const date = new Date(rel.published_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                
                // Konversi Markdown ke HTML
                const htmlContent = marked.parse(rel.body || '');

                const card = document.createElement('div');
                card.className = `bg-white border ${isLatest ? 'border-blue-100 ring-4 ring-blue-50' : 'border-slate-200'} rounded-[2.5rem] p-8 md:p-10 shadow-sm transition-all duration-300 hover:shadow-md overflow-hidden`;
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start mb-8 gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[10px] font-black uppercase tracking-[0.15em] ${isLatest ? 'text-blue-600' : 'text-slate-400'}">
                                    ${isLatest ? 'Stable Latest Release' : 'Older Version History'}
                                </span>
                                ${isLatest ? '<span class="w-2 h-2 rounded-full bg-blue-600 animate-ping"></span>' : ''}
                            </div>
                            <h3 class="text-4xl font-black text-slate-900 tracking-tight">${rel.tag_name}</h3>
                            <div class="flex items-center gap-2 text-slate-400 text-xs mt-2 font-medium">
                                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                <span>Rilis pada ${date}</span>
                            </div>
                        </div>
                        <div class="bg-slate-50 px-4 py-2 rounded-xl text-[10px] font-bold font-mono text-slate-500 border border-slate-100 tracking-wider">
                            ${rel.target_commitish.toUpperCase()}
                        </div>
                    </div>

                    <div class="markdown-content border-t border-slate-100 pt-6">
                        ${isLatest ? htmlContent : `
                            <details class="group">
                                <summary class="list-none cursor-pointer text-blue-600 font-bold text-sm flex items-center gap-2 hover:text-blue-700 transition-colors outline-none">
                                    <span class="bg-blue-50 p-1.5 rounded-lg group-open:rotate-90 transition-transform">
                                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                    </span>
                                    LIHAT CATATAN PERUBAHAN
                                </summary>
                                <div class="mt-6 p-6 bg-slate-50 rounded-[1.5rem] border border-slate-100 text-sm shadow-inner">
                                    ${htmlContent}
                                </div>
                            </details>
                        `}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-10">
                        ${rel.assets.map(a => `
                            <a href="${a.browser_download_url}" class="flex items-center justify-between p-5 ${isLatest ? 'bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-100' : 'bg-slate-800 hover:bg-slate-900'} text-white rounded-[1.25rem] transition-all duration-300 group active:scale-95">
                                <div class="flex items-center gap-4">
                                    <div class="bg-white/20 p-2 rounded-lg group-hover:scale-110 transition-transform">
                                        <i data-lucide="download" class="w-5 h-5"></i>
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Download Asset</span>
                                        <span class="text-sm font-bold truncate max-w-[150px]">${a.name}</span>
                                    </div>
                                </div>
                                <div class="text-[10px] font-black bg-black/10 px-2 py-1 rounded-md border border-white/10 italic">
                                    ${(a.size / 1024 / 1024).toFixed(1)} MB
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
            // Re-inisialisasi ikon Lucide
            lucide.createIcons();
        }

        // Fitur Search
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(r => 
                r.tag_name.toLowerCase().includes(term) || 
                (r.name && r.name.toLowerCase().includes(term))
            );
            render(filtered);
        });

        fetchReleases();
    </script>
</body>
</html>
