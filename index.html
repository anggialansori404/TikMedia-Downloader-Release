<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikMedia Downloader - Release Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="text-center mb-16">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 sm:text-5xl mb-4">
                TikMedia Downloader
            </h1>
            <p class="text-lg text-gray-600">Download versi terbaru dan lihat catatan perubahan aplikasi.</p>
        </header>

        <div id="release-container" class="space-y-8">
            <div class="animate-pulse flex space-x-4 p-6 bg-white rounded-xl border border-gray-200">
                <div class="flex-1 space-y-4 py-1">
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="space-y-2">
                        <div class="h-4 bg-gray-200 rounded"></div>
                        <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const repo = "anggialansori404/TikMedia-Downloader-Release";
        const container = document.getElementById('release-container');

        async function fetchReleases() {
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/releases`);
                if (!response.ok) throw new Error('Repo tidak ditemukan');
                const data = await response.json();
                
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">Belum ada release yang dipublikasikan.</p>';
                    return;
                }

                data.forEach((release, index) => {
                    const isLatest = index === 0;
                    const date = new Date(release.published_at).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    // Cari asset (misal file .apk atau .zip)
                    const assetsHtml = release.assets.map(asset => `
                        <a href="${asset.browser_download_url}" 
                           class="inline-flex items-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors shadow-sm gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Download ${asset.name}
                        </a>
                    `).join('');

                    const card = document.createElement('div');
                    card.className = `bg-white rounded-2xl border ${isLatest ? 'border-blue-500 ring-1 ring-blue-500' : 'border-gray-200'} p-6 shadow-sm transition-all hover:shadow-md`;
                    
                    card.innerHTML = `
                        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                            <div>
                                ${isLatest ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 mb-2">Latest Release</span>' : ''}
                                <h2 class="text-2xl font-bold text-gray-900">${release.name || release.tag_name}</h2>
                                <p class="text-sm text-gray-500 mt-1 flex items-center gap-1">
                                    <i data-lucide="calendar" class="w-3 h-3"></i> ${date}
                                </p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs font-mono rounded-md border border-gray-200 italic">
                                    ${release.tag_name}
                                </span>
                            </div>
                        </div>

                        <div class="markdown-body prose prose-sm max-w-none text-gray-700 mb-8 border-t border-gray-100 pt-4">
                            ${release.body ? release.body.replace(/\n/g, '<br>') : 'Tidak ada deskripsi.'}
                        </div>

                        <div class="flex flex-wrap gap-3 items-center border-t border-gray-100 pt-6">
                            ${assetsHtml || `<p class="text-sm text-gray-400">Tidak ada file binary.</p>`}
                            <a href="${release.html_url}" target="_blank" class="inline-flex items-center px-5 py-2.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-semibold rounded-lg transition-colors gap-2">
                                <i data-lucide="github" class="w-4 h-4"></i>
                                View Source
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Jalankan icon lucide
                lucide.createIcons();

            } catch (error) {
                container.innerHTML = `
                    <div class="text-center p-8 bg-red-50 rounded-xl border border-red-200 text-red-600">
                        Gagal memuat data. Pastikan nama repositori benar dan bersifat publik.
                    </div>
                `;
            }
        }

        fetchReleases();
    </script>
</body>
</html>
