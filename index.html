<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release Notes</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; }
        .release { border-bottom: 1px solid #ddd; padding: 10px 0; }
        .tag { background: #e1f5fe; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Latest Releases</h1>
    <div id="release-container">Loading releases...</div>

    <script>
        const repo = "anggialansori404/TikMedia-Downloader-Release";
        const container = document.getElementById('release-container');

        async function fetchReleases() {
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/releases`);
                const data = await response.json();
                
                container.innerHTML = '';
                data.forEach(release => {
                    const div = document.createElement('div');
                    div.className = 'release';
                    div.innerHTML = `
                        <h2>${release.name || release.tag_name} <span class="tag">${release.tag_name}</span></h2>
                        <p><small>Released on: ${new Date(release.published_at).toLocaleDateString()}</small></p>
                        <div>${release.body.replace(/\n/g, '<br>')}</div>
                        <a href="${release.html_url}" target="_blank">View on GitHub</a>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                container.innerHTML = 'Gagal memuat data release.';
            }
        }

        fetchReleases();
    </script>
</body>
</html>
