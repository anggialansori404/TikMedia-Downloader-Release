<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikMedia Downloader | Release Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        
        .markdown-content h1, .markdown-content h2 { font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #1e293b; font-size: 1.1rem; }
        .markdown-content p { margin-bottom: 0.4rem; line-height: 1.5; font-size: 0.85rem; color: #475569; }
        .markdown-content ul { margin-bottom: 0.8rem; }
        .markdown-content li { margin-bottom: 0.2rem; padding-left: 1.2rem; position: relative; list-style: none; font-size: 0.85rem; color: #475569; }
        .markdown-content li::before { content: "•"; position: absolute; left: 0.4rem; color: #3b82f6; font-weight: bold; }
        .markdown-content strong { color: #0f172a; font-weight: 600; }
        .markdown-content code { background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 4px; font-family: monospace; font-size: 0.8em; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <nav class="sticky top-0 z-50 glass border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                    <i data-lucide="download-cloud" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-900">TikMedia</span>
            </div>
            <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                <a href="#" class="hover:text-blue-600 transition-colors">Beranda</a>
                <a href="#releases" class="hover:text-blue-600 transition-colors text-blue-600">Releases</a>
            </div>
            <a href="https://github.com/anggialansori404/TikMedia-Downloader-Release" target="_blank" 
               class="bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-semibold hover:bg-slate-800 transition-all flex items-center gap-2">
                <i data-lucide="github" class="w-4 h-4"></i> GitHub Repo
            </a>
        </div>
    </nav>

    <main id="releases" class="max-w-4xl mx-auto px-4 py-12">
        <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
            <h2 class="text-xl font-bold flex items-center gap-2 text-slate-800">
                <i data-lucide="history" class="text-blue-600 w-5 h-5"></i> Release History
            </h2>
            <div class="relative w-full md:w-64">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="versionSearch" placeholder="Cari versi..." 
                       class="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all shadow-sm">
            </div>
        </div>

        <div id="release-container" class="space-y-6">
            <div class="animate-pulse bg-white p-6 rounded-2xl border border-slate-200 h-40"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 pt-12 pb-8">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <div class="flex flex-col items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-slate-900 rounded flex items-center justify-center text-white font-bold text-[10px]">T</div>
                    <span class="font-bold text-slate-800 text-sm italic">TikMedia Project</span>
                </div>
                <p class="text-slate-500 text-xs max-w-sm">
                    A simple and efficient tool for media download management.
                </p>
                <div class="flex gap-4 mt-2">
                    <a href="https://github.com/anggialansori404" target="_blank" class="text-slate-400 hover:text-blue-600 flex items-center gap-1 text-[10px] font-medium transition-colors">
                        <i data-lucide="github" class="w-4 h-4"></i> anggialansori404
                    </a>
                </div>
            </div>
            <div class="border-t border-slate-100 mt-8 pt-6 text-slate-400 text-[10px]">
                &copy; 2026 TikMedia Downloader. Open source project by Anggi Al' Ansori.
            </div>
        </div>
    </footer>

    <script>
        const repo = "anggialansori404/TikMedia-Downloader-Release";
        const container = document.getElementById('release-container');
        const searchInput = document.getElementById('versionSearch');
        let allData = [];

        marked.setOptions({ breaks: true, gfm: true });

        function getDeviceLabel(fileName) {
            const name = fileName.toLowerCase();
            if (name.includes('v7a')) return "Older Devices (32-bit)";
            if (name.includes('v8a')) return "Newer Devices (64-bit)";
            if (name.includes('x86')) return "Emulator / PC Only";
            return "Universal Build";
        }

        async function fetchReleases() {
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
                if (!res.ok) throw new Error('API Rate Limit or Repo Not Found');
                allData = await res.json();
                render(allData);
            } catch (e) { 
                container.innerHTML = `<div class="p-10 text-center bg-red-50 text-red-600 rounded-2xl border border-red-100 text-xs">Gagal memuat data: ${e.message}</div>`; 
            }
        }

        function render(data) {
            container.innerHTML = '';
            data.forEach((rel, idx) => {
                const isLatest = idx === 0;
                const date = new Date(rel.published_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const htmlContent = marked.parse(rel.body || '');

                const card = document.createElement('div');
                card.className = `bg-white border ${isLatest ? 'border-blue-100 shadow-md shadow-blue-50' : 'border-slate-200 shadow-sm'} rounded-2xl p-5 md:p-6 transition-all hover:border-blue-200`;
                card.innerHTML = `
                    <div class="flex flex-wrap justify-between items-start gap-3 mb-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="text-lg font-bold text-slate-900">${rel.tag_name}</h3>
                                ${isLatest ? '<span class="px-1.5 py-0.5 bg-blue-100 text-blue-700 text-[9px] font-bold rounded uppercase">Latest</span>' : ''}
                            </div>
                            <p class="text-slate-400 text-[10px] flex items-center gap-1">
                                <i data-lucide="calendar" class="w-3 h-3 text-slate-300"></i> ${date}
                            </p>
                        </div>
                        <div class="bg-slate-50 px-2 py-1 rounded text-[9px] font-mono text-slate-500 border border-slate-100">${rel.target_commitish}</div>
                    </div>

                    <div class="markdown-content border-t border-slate-50 pt-3">
                        ${isLatest ? htmlContent : `
                            <details class="group">
                                <summary class="list-none cursor-pointer text-blue-600 font-semibold flex items-center gap-1 text-[11px] outline-none">
                                    <i data-lucide="chevron-right" class="w-3.5 h-3.5 group-open:rotate-90 transition-transform"></i> Details
                                </summary>
                                <div class="mt-3 p-4 bg-slate-50 rounded-xl border border-slate-100 text-[11px] shadow-inner">
                                    ${htmlContent}
                                </div>
                            </details>
                        `}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-6">
                        ${rel.assets.map(a => `
                            <a href="${a.browser_download_url}" class="flex items-start gap-3 p-3 bg-white border border-slate-200 rounded-xl hover:border-blue-400 hover:bg-blue-50 transition-all group overflow-hidden">
                                <div class="bg-blue-50 p-2 rounded-lg group-hover:bg-blue-100">
                                    <i data-lucide="download" class="w-4 h-4 text-blue-600"></i>
                                </div>
                                <div class="flex flex-col min-w-0 pr-2">
                                    <span class="text-[10px] font-bold text-slate-800 truncate" title="${a.name}">${a.name}</span>
                                    <span class="text-[9px] font-semibold text-blue-600">${getDeviceLabel(a.name)}</span>
                                    <span class="text-[9px] text-slate-400 italic">Size: ${(a.size / 1024 / 1024).toFixed(1)} MB</span>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            render(allData.filter(r => r.tag_name.toLowerCase().includes(term) || (r.name && r.name.toLowerCase().includes(term))));
        });

        fetchReleases();
    </script>
</body>
</html>
